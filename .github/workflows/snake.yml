# Redraws the contribution-graph snake once a day and publishes it to the
# `output` branch, which README.md reads the SVGs from.
name: snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # anime pastel: lavender dots, sakura snake
          outputs: |
            dist/snake-light.svg?color_snake=#ff7aa8&color_dots=#f6f0ff,#e2dafc,#c4b5ff,#9f8cff,#6a5ae0
            dist/snake-dark.svg?color_snake=#ff9cc0&color_dots=#1f1b2e,#3b3166,#5d4fb0,#8f80ff,#c4b5ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
