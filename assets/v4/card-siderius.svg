<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><style>
text{font-family:'Hiragino Sans','Segoe UI',system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif}
.petal{animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-14px,10px) rotate(24deg)}}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
.kira{transform-box:fill-box;transform-origin:center;animation:kira 3.2s ease-in-out infinite}
@keyframes kira{0%,100%{opacity:.25;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.petal,.glow,.kira{animation:none}}
</style><defs>
  <linearGradient id="skys" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ebe4fb"/><stop offset=".6" stop-color="#ddd6f6"/><stop offset="1" stop-color="#f7e9f2"/>
  </linearGradient>
  <linearGradient id="glasss" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/><stop offset="1" stop-color="#ffffff" stop-opacity=".32"/>
  </linearGradient>
  <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6fdcae"/><stop offset="1" stop-color="#c9f3e1" stop-opacity=".5"/>
  </linearGradient>
  <filter id="blurs" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="clouds" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs><defs><clipPath id="clips"><rect width="640" height="360" rx="26"/></clipPath></defs><g clip-path="url(#clips)"><rect width="640" height="360" fill="url(#skys)"/><g filter="url(#clouds)" fill="#ffffff" opacity=".85"><ellipse cx="76.8" cy="352.8" rx="140.8" ry="57.6"/><ellipse cx="288.0" cy="367.2" rx="160.0" ry="50.400000000000006"/><ellipse cx="544.0" cy="356.4" rx="160.0" ry="54.0"/></g><path d="M56,40 H410 V304 L394,320 H40 V56 Z" fill="url(#glasss)" stroke="#6fdcae" stroke-width="2" stroke-opacity=".85"/><path d="M66,47 H120" stroke="#6fdcae" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="394" cy="54" r="3.5" fill="#f4a9c4"/><g stroke="#b6b5e9" stroke-width="1" opacity=".6"><path d="M64,120 H386"/><path d="M64,170 H386"/><path d="M64,220 H386"/><path d="M64,270 H386"/></g><rect x="72" y="250" width="26" height="40" rx="5" fill="url(#bars)"/><rect x="116" y="228" width="26" height="62" rx="5" fill="url(#bars)"/><rect x="160" y="234" width="26" height="56" rx="5" fill="url(#bars)"/><rect x="204" y="202" width="26" height="88" rx="5" fill="url(#bars)"/><rect x="248" y="186" width="26" height="104" rx="5" fill="url(#bars)"/><rect x="292" y="150" width="26" height="140" rx="5" fill="url(#bars)"/><rect x="336" y="118" width="26" height="172" rx="5" fill="url(#bars)"/><polyline points="85,234 129,212 173,218 217,186 261,170 305,134 349,102" fill="none" stroke="#2fae7c" stroke-width="3" stroke-linejoin="round"/><path class="glow" d="M510,78 L584,106 V174 C584,224 546,254 510,270 C474,254 436,224 436,174 V106Z" fill="none" stroke="#6fdcae" stroke-width="14" filter="url(#blurs)"/><path d="M510,78 L584,106 V174 C584,224 546,254 510,270 C474,254 436,224 436,174 V106Z" fill="#ffffff" fill-opacity=".7" stroke="#6fdcae" stroke-width="5"/><path d="M476,176 L502,202 L548,148" fill="none" stroke="#2fae7c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="150" r="40" fill="#ffffff" fill-opacity=".35" stroke="#8f8bd0" stroke-width="6"/><path d="M358,178 L392,212" stroke="#8f8bd0" stroke-width="10" stroke-linecap="round"/><g class="petal" style="animation-delay:-1s;transform-origin:600px 50px"><path transform="translate(600,50) rotate(30) scale(1.3)" fill="#fbdbe8" stroke="#f4a9c4" stroke-width=".8" opacity="0.9" d="M0,-10 C7,-10 10,-2 7,5 C5,9 2,11 0,8 C-2,11 -5,9 -7,5 C-10,-2 -7,-10 0,-10Z"/></g><g class="petal" style="animation-delay:-5s;transform-origin:440px 320px"><path transform="translate(440,320) rotate(-20) scale(1.1)" fill="#fbdbe8" stroke="#f4a9c4" stroke-width=".8" opacity="0.9" d="M0,-10 C7,-10 10,-2 7,5 C5,9 2,11 0,8 C-2,11 -5,9 -7,5 C-10,-2 -7,-10 0,-10Z"/></g><path class="kira" style="animation-delay:-0.4s" fill="#ffffff" d="M450,60 Q451.8,68.2 460,70 Q451.8,71.8 450,80 Q448.2,71.8 440,70 Q448.2,68.2 450,60Z"/></g><rect x="1" y="1" width="638" height="358" rx="26" fill="none" stroke="#b6b5e9" stroke-width="2"/></svg>