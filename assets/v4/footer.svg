    <stop offset="0" stop-color="#ebe4fb"/><stop offset=".6" stop-color="#ddd6f6"/><stop offset="1" stop-color="#f7e9f2"/>
  </linearGradient>
  <linearGradient id="glassf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/><stop offset="1" stop-color="#ffffff" stop-opacity=".32"/>
  </linearGradient>
  <linearGradient id="barf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6fdcae"/><stop offset="1" stop-color="#c9f3e1" stop-opacity=".5"/>
  </linearGradient>
  <filter id="blurf" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="cloudf" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
